; ============================================================================
;  PlatformIO-Konfiguration fuer OrcaOne
; ----------------------------------------------------------------------------
;  Legt Board, Framework und alle benoetigten Bibliotheken fest. Dadurch hat
;  jede Person auf jedem Rechner EXAKT die gleiche Umgebung - einfach dieses
;  Projekt in VS Code mit der PlatformIO-Erweiterung oeffnen und bauen.
;
;  Bauen/Hochladen:
;    PlatformIO: Build  (Haken)      -> kompilieren
;    PlatformIO: Upload (Pfeil)      -> auf den ESP32 flashen
;    Upload Filesystem Image         -> Inhalt von web/ (Weboberflaeche) flashen
; ============================================================================
[platformio]
; Die Weboberflaeche liegt in firmware/web/ (statt im Standardordner "data").
; Diese Zeile sagt PlatformIO, dass genau dieser Ordner ins Dateisystem des
; ESP32 geflasht wird - kein separater Kopierschritt noetig.
data_dir = web

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson@^7.1.0          ; JSON fuer Status & Befehle
    ESP32Async/AsyncTCP@^3.2.0            ; Unterbau fuer den Webserver
    ESP32Async/ESPAsyncWebServer@^3.3.0   ; Webserver + WebSocket
    adafruit/Adafruit PN532@^1.3.3        ; NFC/RFID (PN532)
    crankyoldgit/IRremoteESP8266@^2.8.6   ; IR aufnehmen & senden
    nrf24/RF24@^1.4.9                     ; NRF24L01+ (2,4 GHz)
    olikraus/U8g2@^2.35.30                ; OLED-Display (SH1106 1,3")
    madhephaestus/ESP32Encoder@^0.11.7    ; Drehgeber auslesen
